<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Run Base</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --black: #080808;
  --black2: #0f0f0f;
  --surface: #141414;
  --surface2: #1a1a1a;
  --border: #1e1e1e;
  --border2: #252525;
  --gold: #C8952A;
  --gold-light: #E8B84B;
  --gold-dim: rgba(200,149,42,0.15);
  --gold-dim2: rgba(200,149,42,0.08);
  --text: #F0EDE6;
  --text-dim: #8a8580;
  --text-muted: #3a3a38;
  --green: #5a9e6f;
  --red: #c0503a;
  --blue: #5a8fb0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--black);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-weight:300;
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:var(--border2)}

.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* HEADER */
.header{
  padding:16px 20px 14px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--black);z-index:40;
}
.logo-header{display:flex;align-items:center;gap:10px}
.logo-rb{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-style:italic;
  font-size:22px;
  letter-spacing:-.01em;
  background:linear-gradient(135deg,#C8952A 0%,#F0C060 50%,#C8952A 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
}
.logo-wordmark{
  font-family:'DM Mono',monospace;
  font-size:8px;
  letter-spacing:.25em;
  color:var(--text-dim);
  text-transform:uppercase;
  padding-top:2px;
}

/* NAV */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:var(--black);
  border-top:1px solid var(--border);
  display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-btn{
  flex:1;padding:11px 0 13px;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;
}
.nav-btn .icon{font-size:15px;color:var(--text-muted);transition:color .2s}
.nav-btn .lbl{
  font-family:'DM Mono',monospace;font-size:7px;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);transition:color .2s;
}
.nav-btn.active .icon,.nav-btn.active .lbl{color:var(--gold)}
.nav-btn::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:1px;background:var(--gold);transition:width .3s;
}
.nav-btn.active::after{width:28px}
.badge{
  position:absolute;top:8px;right:calc(50% - 16px);
  width:13px;height:13px;border-radius:50%;
  background:var(--gold);color:var(--black);
  font-size:7px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:22px 18px 100px}

/* CARDS */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;padding:18px;
}
.card.gold-border{border-color:rgba(200,149,42,0.3)}
.card.gold-tint{background:linear-gradient(135deg,#111008 0%,var(--surface) 100%);border-color:rgba(200,149,42,0.2)}

/* LABELS */
.eyebrow{
  font-family:'DM Mono',monospace;
  font-size:8px;letter-spacing:.25em;text-transform:uppercase;
  color:var(--gold);margin-bottom:10px;opacity:.8;
}
.title-lg{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;font-style:italic;
  font-size:36px;color:var(--text);line-height:.95;margin-bottom:18px;
}
.tag{
  font-family:'DM Mono',monospace;font-size:8px;
  letter-spacing:.12em;text-transform:uppercase;
  border:1px solid;padding:2px 8px;border-radius:2px;
  white-space:nowrap;display:inline-block;
}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.stat-val{
  font-family:'Cormorant Garamond',serif;
  font-size:26px;font-weight:400;font-style:italic;
  color:var(--text-dim);line-height:1;text-align:center;
}
.stat-val.gold{color:var(--gold)}
.stat-lbl{
  font-family:'DM Mono',monospace;font-size:7px;
  color:var(--text-muted);letter-spacing:.1em;
  text-transform:uppercase;margin-top:3px;text-align:center;
}

/* ATHLETE ROW */
.athlete-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;margin-bottom:10px;
  transition:border-color .2s;
}
.athlete-row:active{border-color:rgba(200,149,42,0.3)}

/* AVATAR */
.avatar{
  border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;color:var(--text-dim);
  font-weight:400;flex-shrink:0;border:1px solid var(--border2);
  letter-spacing:.05em;
}

/* PROGRESS */
.progress-bar{margin-top:14px;background:var(--border2);border-radius:2px;height:1px;overflow:visible;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-light) 100%);border-radius:2px;transition:width .6s ease;position:relative}
.progress-fill::after{content:'';position:absolute;right:-1px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--gold-light)}

/* WORKOUT CARDS */
.workout-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:15px 16px;margin-bottom:8px;
}
.workout-card.done{border-color:rgba(90,158,111,0.25)}

/* BUTTONS */
.btn{
  border:none;border-radius:8px;padding:13px;
  font-family:'DM Mono',monospace;font-weight:400;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;width:100%;margin-top:12px;transition:opacity .2s;
}
.btn:active{opacity:.8}
.btn-gold{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);
  color:var(--black);
}
.btn-outline{
  background:transparent;
  border:1px solid rgba(200,149,42,0.4);
  color:var(--gold);
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;
}
.back-btn{
  background:none;border:none;color:var(--text-dim);cursor:pointer;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;
  margin-bottom:18px;padding:0;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;
}
.back-btn:hover{color:var(--gold)}

/* TABS */
.tab-row{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tab-btn{
  flex:1;padding:10px 0;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:8px;
  letter-spacing:.12em;text-transform:uppercase;
  border:none;background:transparent;color:var(--text-muted);
  border-right:1px solid var(--border);transition:all .2s;
}
.tab-btn:last-child{border-right:none}
.tab-btn.active{background:var(--gold-dim2);color:var(--gold)}

/* WEEK BLOCKS */
.week-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px}
.week-block.current{border-color:rgba(200,149,42,0.35)}
.week-header{padding:15px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.week-body{border-top:1px solid var(--border);padding:14px 16px;display:none;flex-direction:column;gap:8px}
.week-body.open{display:flex}
.day-row{padding:12px 14px;background:var(--black2);border-radius:8px;border:1px solid var(--border)}

/* FEEDBACK */
.fb-card{
  background:var(--surface);border-left:2px solid var(--green);
  border-radius:12px;padding:15px 16px;margin-bottom:8px;
}
.coach-fb-card{
  background:var(--surface);border-radius:12px;
  padding:15px 16px;margin-bottom:8px;border-left:2px solid;
}

/* ZONE */
.zone-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zone-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.95);z-index:200;
  flex-direction:column;justify-content:flex-end;
  max-width:430px;margin:0 auto;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--surface2);border-radius:20px 20px 0 0;
  padding:26px 22px;border-top:1px solid rgba(200,149,42,0.3);
  max-height:92vh;overflow-y:auto;padding-bottom:36px;
}

/* RPE / PILLS */
.rpe-grid{display:flex;gap:4px;margin-top:10px}
.rpe-btn{
  flex:1;height:36px;border-radius:6px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text-muted);font-family:'DM Mono',monospace;
  font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;
}
.en-btn{
  flex:1;padding:9px 2px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border2);background:transparent;
  color:var(--text-muted);font-family:'DM Mono',monospace;
  font-size:8px;text-transform:uppercase;letter-spacing:.05em;transition:all .15s;
}
.fb-textarea{
  width:100%;background:var(--black2);
  border:1px solid var(--border2);border-radius:8px;
  padding:12px 14px;color:var(--text);
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:300;
  outline:none;resize:none;line-height:1.6;
}
.fb-textarea:focus{border-color:rgba(200,149,42,0.4)}
.submit-btn{
  width:100%;padding:14px;border-radius:8px;border:none;
  background:var(--surface);color:var(--text-muted);
  font-family:'DM Mono',monospace;font-weight:400;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:default;transition:all .3s;
}
.submit-btn.ready{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);
  color:var(--black);cursor:pointer;
}

/* LOGIN */
.login-screen{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 28px;
  background:radial-gradient(ellipse at 50% 35%,#1a1200 0%,var(--black) 65%);
}
.login-logo{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;font-style:italic;font-size:72px;
  line-height:.9;text-align:center;margin-bottom:8px;
  background:linear-gradient(135deg,#A07020 0%,#F0C060 45%,#C8952A 70%,#E8A830 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-.02em;
}
.login-sub{
  font-family:'DM Mono',monospace;font-size:8px;
  color:var(--text-muted);letter-spacing:.35em;
  text-transform:uppercase;margin-bottom:52px;text-align:center;
}
input[type=email],input[type=password]{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:8px;padding:14px 16px;color:var(--text);
  font-family:'Outfit',sans-serif;font-size:14px;font-weight:300;
  outline:none;width:100%;transition:border-color .2s;
}
input[type=email]:focus,input[type=password]:focus{border-color:rgba(200,149,42,0.5)}
input::placeholder{color:var(--text-muted)}
.error-msg{
  background:rgba(192,80,58,0.1);border:1px solid rgba(192,80,58,0.25);
  border-radius:8px;padding:10px 14px;
  color:var(--red);font-family:'DM Mono',monospace;font-size:10px;
  margin-top:8px;display:none;
}

/* TOAST */
.toast{
  display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#fff;padding:10px 20px;border-radius:8px;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;
  z-index:300;white-space:nowrap;box-shadow:0 4px 30px rgba(0,0,0,.6);
}
.loading{display:flex;align-items:center;justify-content:center;padding:70px;flex-direction:column;gap:16px}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* OBS */
.obs-card{
  background:var(--gold-dim2);border:1px solid rgba(200,149,42,0.2);
  border-left:2px solid var(--gold);border-radius:12px;
  padding:14px 16px;margin-bottom:14px;
}

/* CALENDAR */
.cal-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.cal-day{width:28px;font-family:'DM Mono',monospace;font-size:8px;color:var(--text-muted);text-transform:uppercase;padding-top:10px;text-align:center;flex-shrink:0}
.cal-events{flex:1;display:flex;flex-direction:column;gap:4px}
.cal-event{background:var(--surface);border:1px solid var(--border);border-left:2px solid;border-radius:6px;padding:8px 12px;font-size:12px;color:var(--text-dim)}
.cal-empty{border:1px dashed var(--border);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--text-muted)}

/* RELATORIO */
.rel-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.rel-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 12px;position:relative;overflow:hidden}
.rel-stat::before{content:'';position:absolute;top:0;left:0;width:1px;height:100%;background:var(--gold);opacity:.5}
.rel-stat-val{font-family:'Cormorant Garamond',serif;font-weight:400;font-style:italic;font-size:26px;color:var(--gold);line-height:1}
.rel-stat-lbl{font-family:'DM Mono',monospace;font-size:7px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rel-stat-sub{font-family:'DM Mono',monospace;font-size:7px;color:var(--text-muted);margin-top:2px;opacity:.5}
.rel-badge{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid;border-radius:2px;display:inline-block;margin:3px 3px 3px 0}
.rel-badge.green{border-color:rgba(90,158,111,0.5);color:var(--green)}
.rel-badge.gold{border-color:rgba(200,149,42,0.5);color:var(--gold)}
.rel-badge.blue{border-color:rgba(90,143,176,0.5);color:var(--blue)}
.rel-badge.red{border-color:rgba(192,80,58,0.5);color:var(--red)}
.rel-summary{background:var(--surface);border:1px solid var(--border);border-left:2px solid rgba(200,149,42,0.4);border-radius:12px;padding:18px;font-size:13px;color:var(--text-dim);line-height:1.85;margin-bottom:16px;font-weight:300}
.rel-summary strong{color:var(--text);font-weight:500}
.rel-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rel-info{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.rel-info.alert{border-left:2px solid rgba(192,80,58,0.6)}
.rel-info.highlight{border-left:2px solid rgba(90,158,111,0.6)}
.rel-info.note{border-left:2px solid rgba(90,143,176,0.6)}
.rel-info.next{border-left:2px solid rgba(200,149,42,0.6)}
.rel-info-title{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px}
.rel-info p{font-size:12px;color:var(--text-muted);line-height:1.6;font-weight:300}
.rel-info p strong{color:var(--text-dim);font-weight:500}
.rel-prog-item{margin-bottom:14px}
.rel-prog-header{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:8px;margin-bottom:6px}
.rel-prog-label{color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
.rel-prog-val{color:var(--text-dim)}
.rel-prog-bar{height:1px;background:var(--border2);border-radius:1px;overflow:visible;position:relative}
.rel-prog-fill{height:100%;border-radius:1px;transition:width 1.2s ease;position:relative}
.rel-prog-fill::after{content:'';position:absolute;right:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:inherit}
.rel-coach-note{background:linear-gradient(135deg,#0f0b02 0%,var(--surface) 100%);border:1px solid rgba(200,149,42,0.2);border-left:2px solid var(--gold);border-radius:12px;padding:18px}
.rel-coach-note p{font-size:13px;color:var(--text-dim);line-height:1.85;font-weight:300}
.rel-coach-note p strong{color:var(--gold)}
.rel-coach-sig{margin-top:14px;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);opacity:.5}

/* GYM */
.gym-input{
  width:100%;background:var(--black2);border:1px solid var(--border);
  border-radius:6px;padding:7px 10px;color:var(--text);
  font-family:'DM Mono',monospace;font-size:11px;font-weight:300;
  outline:none;margin-top:8px;transition:border-color .2s;
}
.gym-input:focus{border-color:rgba(200,149,42,0.4)}

/* divider */
.divider{height:1px;background:var(--border);margin:20px 0;opacity:.5}

/* greeting */
.greeting-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--text-muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.greeting-name{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:42px;color:var(--text);line-height:.95;margin-bottom:22px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-screen">
    <div class="login-logo">rb</div>
    <div class="login-sub">run base</div>
    <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px">
      <input type="email" id="login-email" placeholder="email" autocomplete="email">
      <input type="password" id="login-password" placeholder="senha" autocomplete="current-password">
      <div id="login-error" class="error-msg">Email ou senha incorretos</div>
      <button id="login-btn" onclick="doLogin()" style="background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);border:none;border-radius:8px;padding:15px;color:var(--black);cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-top:6px;transition:opacity .2s">ENTRAR</button>
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:7px;color:var(--text-muted);margin-top:48px;letter-spacing:.25em;text-transform:uppercase;text-align:center;opacity:.4">underpaced & overthinking</div>
  </div>
</div>

<!-- COACH -->
<div id="screen-coach" class="screen">
  <div class="header">
    <div class="logo-header">
      <div class="logo-rb">rb</div>
      <div class="logo-wordmark">run base</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="tag" style="color:var(--gold);border-color:rgba(200,149,42,0.3);font-size:7px">Coach</span>
      <button onclick="doLogout()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:4px">⎋</button>
    </div>
  </div>
  <div id="coach-content" class="content"></div>
  <nav class="nav">
    <button class="nav-btn active" id="cnav-dashboard" onclick="coachTab('dashboard')"><span class="icon">◈</span><span class="lbl">Home</span></button>
    <button class="nav-btn" id="cnav-athletes" onclick="coachTab('athletes')"><span class="icon">◉</span><span class="lbl">Alunos</span></button>
    <button class="nav-btn" id="cnav-feedbacks" onclick="coachTab('feedbacks')"><span class="icon">◎</span><span class="lbl">Feedbacks</span><div class="badge" id="fbBadge" style="display:none">0</div></button>
    <button class="nav-btn" id="cnav-calendar" onclick="coachTab('calendar')"><span class="icon">◷</span><span class="lbl">Agenda</span></button>
  </nav>
</div>

<!-- ATHLETE -->
<div id="screen-athlete" class="screen">
  <div class="header">
    <div class="logo-header">
      <div class="logo-rb">rb</div>
      <div class="logo-wordmark">run base</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="avatar" id="ath-avatar" style="width:34px;height:34px;font-size:10px"></div>
      <button onclick="doLogout()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:4px">⎋</button>
    </div>
  </div>
  <div id="athlete-content" class="content"></div>

async function loadAthlete(){
  loading('athlete-content');
  var aRes=await sb.from('athletes').select('*').eq('id',currentUser.id).single();
  if(!aRes.data){showToast('Perfil não encontrado',false);return;}
  athleteData=aRes.data;
  document.getElementById('ath-avatar').textContent=athleteData.img;
  var wRes=await sb.from('weeks').select('*,workouts(*)').eq('athlete_id',currentUser.id).order('week_number');
  athleteWeeks=wRes.data||[];
  var zRes=await sb.from('zones').select('*').eq('athlete_id',currentUser.id).order('sort_order');
  athleteZones=zRes.data||[];
  var allWids=athleteWeeks.reduce(function(acc,w){return acc.concat((w.workouts||[]).map(function(x){return x.id;}));},[]);
  var allFbRes=allWids.length>0?await sb.from('feedbacks').select('workout_id').in('workout_id',allWids):{data:[]};
  var doneIds=new Set((allFbRes.data||[]).map(function(f){return f.workout_id;}));
  var currentWeek=athleteWeeks.find(function(w){var ws=w.workouts||[];return ws.length>0&&ws.some(function(x){return !doneIds.has(x.id);});})||athleteWeeks[athleteWeeks.length-1]||athleteWeeks[0];
  openWeekIdx=athleteWeeks.indexOf(currentWeek);
  if(currentWeek&&currentWeek.workouts){
    workouts=currentWeek.workouts.sort(function(a,b){return a.sort_order-b.sort_order;}).map(function(w){return Object.assign({},w,{done:doneIds.has(w.id),feedback:null});});
    var fbRes=await sb.from('feedbacks').select('*').in('workout_id',workouts.map(function(w){return w.id;}));
    if(fbRes.data){fbRes.data.forEach(function(f){var w=workouts.find(function(x){return x.id===f.workout_id;});if(w){w.done=true;w.feedback=f;}});}
  }
  show('athlete');athTab('home');
}

  document.getElementById('athlete-content').innerHTML=
    '<div style="margin-bottom:22px"><div class="greeting-sub">Olá,</div><div class="greeting-name">'+a.name.split(' ')[0]+'.</div></div>'+
    (today?'<div class="card gold-tint" style="margin-bottom:18px">'+eyebrow('Próximo Treino')+'<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">'+tag(today.day_label,'var(--text-muted)')+' '+tag(today.type,'var(--gold)')+'</div><div style="font-size:14px;margin-bottom:18px;line-height:1.6;color:var(--text-dim);font-weight:300">'+today.description+'</div><button class="btn btn-gold" onclick="openModal('+fp+')">Concluir + Feedback</button></div>':'<div class="card" style="margin-bottom:18px;border-color:rgba(90,158,111,0.25)"><div style="font-family:DM Mono,monospace;font-size:9px;color:var(--green);margin-bottom:6px;letter-spacing:.1em">SEMANA CONCLUÍDA</div><div style="font-size:13px;color:var(--text-muted);font-weight:300">Todos os treinos desta semana foram realizados.</div></div>')+
    '<div class="card" style="margin-bottom:18px">'+eyebrow(week?week.label:'Semana atual')+statGrid([{v:done+'/'+(week&&week.workouts?week.workouts.length:0),l:'Treinos',accent:true},{v:fbs,l:'Feedbacks'},{v:week?week.volume:'—',l:'Volume'}])+'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>'+
    '<div class="card">'+eyebrow('Objetivo')+'<div style="font-family:Cormorant Garamond,serif;font-weight:300;font-style:italic;font-size:22px;color:var(--gold);margin-bottom:6px;line-height:1.2">'+a.goal+'</div><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted);letter-spacing:.05em">'+a.pace+' · '+a.vol+'</div></div>';
}
function renderAthPlanilha(){
  var id=currentUser?currentUser.id:'';var rel=RELATORIOS[id];
  if(rel&&rel.planilha){
    var p=rel.planilha;
    var zonasHTML='<div style="margin-bottom:22px"><div class="eyebrow">Zonas de Ritmo</div>'+p.zonas.map(function(z){return '<div class="zone-row"><div class="zone-dot" style="background:'+z.color+'"></div><span style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted);min-width:110px">'+z.zone+(z.description?' — '+z.description:'')+'</span><span style="font-family:DM Mono,monospace;font-size:10px;color:var(--text-dim)">'+z.pace+'</span></div>';}).join('')+'</div>';
    var bonusRegraHTML='<div style="background:var(--gold-dim2);border:1px dashed rgba(200,149,42,0.2);border-radius:10px;padding:14px 16px;margin-bottom:22px"><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--gold);letter-spacing:.1em;margin-bottom:6px;opacity:.7;text-transform:uppercase">Dia bônus — opcional</div><div style="font-size:12px;color:var(--text-muted);line-height:1.7;font-weight:300">'+p.bonus_regra+'</div></div>';
    var semanasHTML=p.semanas.map(function(s,si){
      var isRegen=s.tag==='Regenerativa';var tagColor=isRegen?'var(--green)':'var(--gold)';
      var treinosHTML=s.treinos.map(function(t){return '<div class="day-row" style="margin-bottom:6px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap"><span style="font-family:DM Mono,monospace;font-size:9px;color:var(--text-muted);min-width:28px">'+t.dia+'</span>'+tag(t.tipo,'var(--gold)')+'</div><div style="font-size:12px;color:var(--text-dim);line-height:1.6;font-weight:300">'+t.desc+'</div></div>';}).join('');
      var bonusHTML='<div style="border-top:1px dashed rgba(200,149,42,0.12);margin-top:8px;padding:10px 0 2px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap"><span style="font-family:DM Mono,monospace;font-size:9px;color:rgba(200,149,42,0.35);min-width:28px">'+s.bonus.dia+'</span>'+tag(s.bonus.tipo||'','rgba(200,149,42,0.35)')+'</div><div style="font-size:12px;color:var(--text-muted);line-height:1.6;font-weight:300;opacity:.6">'+s.bonus.desc+'</div></div>';
      return '<div class="week-block"><div class="week-header" onclick="toggleWeek('+si+')"><div><div style="font-size:15px;font-weight:400;color:var(--text)">'+s.num+'</div><div style="font-family:DM Mono,monospace;font-size:7px;letter-spacing:.1em;margin-top:3px;color:'+tagColor+';text-transform:uppercase">'+s.tag+'</div></div><div style="display:flex;gap:8px;align-items:center"><div style="text-align:right"><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted)">'+s.vol_base+'</div><div style="font-family:DM Mono,monospace;font-size:7px;color:var(--text-muted);opacity:.4">+bônus '+s.vol_bonus+'</div></div><span style="color:var(--text-muted);font-size:11px" id="arrow-'+si+'">'+(si===openWeekIdx?'▲':'▼')+'</span></div></div><div class="week-body'+(si===openWeekIdx?' open':'')+'" id="week-body-'+si+'"><div style="padding:4px 0">'+treinosHTML+bonusHTML+'</div></div></div>';
    }).join('');
    document.getElementById('athlete-content').innerHTML=titleLg('Planilha')+'<div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted);margin-bottom:18px;letter-spacing:.05em">'+athleteData.goal+'</div>'+zonasHTML+bonusRegraHTML+'<div class="eyebrow">Semanas</div>'+semanasHTML;
    return;
  }
  var html=titleLg('Planilha')+'<div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted);margin-bottom:18px;letter-spacing:.05em">'+athleteData.goal+'</div>';
  athleteWeeks.forEach(function(week,wi){
    var isCurrent=week.is_current;var isOpen=wi===openWeekIdx;
    var days=(week.workouts||[]).sort(function(a,b){return a.sort_order-b.sort_order;}).map(function(d){
      var wIdx=workouts.findIndex(function(x){return x.id===d.id;});
      var isDone=wIdx>=0&&workouts[wIdx]&&workouts[wIdx].done;
      var hasFb=wIdx>=0&&workouts[wIdx]&&workouts[wIdx].feedback;
      var fbBtn=wIdx>=0&&!hasFb?'<button onclick="event.stopPropagation();event.preventDefault();openModal('+wIdx+');return false;" style="margin-top:10px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:6px;padding:9px 14px;color:var(--black);font-family:DM Mono,monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;width:100%">'+(isDone?'Dar Feedback':'Concluir + Feedback')+'</button>':'';
      var doneMark=hasFb?'<span style="font-family:DM Mono,monospace;font-size:7px;color:var(--green);margin-left:8px;letter-spacing:.05em">✓ enviado</span>':'';
      return '<div class="day-row"><div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap"><span style="font-family:DM Mono,monospace;font-size:9px;color:var(--text-muted);min-width:28px">'+d.day_label+'</span>'+tag(d.type,'var(--gold)')+doneMark+'</div><div style="font-size:13px;color:var(--text-dim);line-height:1.5;font-weight:300">'+d.description+'</div>'+fbBtn+'</div>';
    }).join('');
    html+='<div class="week-block'+(isCurrent?' current':'')+'"><div class="week-header" onclick="toggleWeek('+wi+')"><div><div style="font-size:15px;font-weight:400;color:'+(isCurrent?'var(--gold)':'var(--text)')+'">'+week.label+'</div>'+(isCurrent?'<div style="font-family:DM Mono,monospace;font-size:7px;color:var(--gold);letter-spacing:.1em;margin-top:2px;text-transform:uppercase">Semana atual</div>':'')+'</div><div style="display:flex;gap:8px;align-items:center"><span style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted)">'+week.volume+'</span><span style="color:var(--text-muted);font-size:11px" id="arrow-'+wi+'">'+(isOpen?'▲':'▼')+'</span></div></div><div class="week-body'+(isOpen?' open':'')+'" id="week-body-'+wi+'">'+days+'</div></div>';
  });
  document.getElementById('athlete-content').innerHTML=html;
}
function toggleWeek(wi){var body=document.getElementById('week-body-'+wi);var arrow=document.getElementById('arrow-'+wi);if(!body||!arrow)return;var isOpen=body.classList.contains('open');body.classList.toggle('open',!isOpen);arrow.textContent=isOpen?'▼':'▲';openWeekIdx=isOpen?-1:wi;}

function renderAthForca(){
  var id=currentUser?currentUser.id:'';var rel=RELATORIOS[id];
  var hasGym=rel&&rel.gym&&rel.gym.length>0;
  if(!hasGym){document.getElementById('athlete-content').innerHTML=titleLg('Força')+'<div style="text-align:center;padding:50px 20px;color:var(--text-muted);font-family:DM Mono,monospace;font-size:10px;line-height:2;letter-spacing:.05em">Treino de força<br>em breve.</div>';return;}
  var storageKey='gym_'+id;var saved={};
  try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}');}catch(e){}
  var html=titleLg('Força')+'<div style="font-family:DM Mono,monospace;font-size:9px;color:var(--text-muted);margin-bottom:18px;font-weight:300">Anote suas cargas abaixo.</div>';
  rel.gym.forEach(function(d){
    html+='<div class="workout-card" style="margin-bottom:10px">';
    html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">';
    html+='<div><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--gold);margin-bottom:3px;letter-spacing:.1em">'+d.dia+'</div>';
    html+='<div style="font-size:14px;font-weight:400;color:var(--text)">'+d.tipo+'</div></div>';
    html+=''+tag(d.tempo,'var(--text-muted)')+'</div>';
    d.blocos.forEach(function(b,bi){
      var k=d.dia+'_'+bi;var v=saved[k]||'';
      html+='<div style="padding:10px 0;border-bottom:1px solid var(--border)">';
      html+='<div style="font-family:DM Mono,monospace;font-size:7px;color:var(--gold);letter-spacing:.12em;margin-bottom:4px;text-transform:uppercase">'+b.bloco+'</div>';
      html+='<div style="font-size:12px;color:var(--text-dim);line-height:1.6;font-weight:300">'+b.ex+'</div>';
      if(b.carga){html+='<input class="gym-input" type="text" placeholder="Carga / observação..." value="'+v+'" data-k="'+storageKey+'" data-i="'+k+'" oninput="gymSave(this)">';}
      html+='</div>';
    });
    html+='</div>';
  });
  document.getElementById('athlete-content').innerHTML=html;
}
function gymSave(el){var storageKey=el.dataset.k;var i=el.dataset.i;var saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}');}catch(e){}saved[i]=el.value;localStorage.setItem(storageKey,JSON.stringify(saved));}

function renderAthFeedback(){
  // ✅ CORREÇÃO 1: mostrar todos os treinos sem feedback (independente de done)
  var pend=workouts.filter(function(w){return !w.feedback;});
  var done=workouts.filter(function(w){return w.feedback;});
  var pendHTML='';
  if(pend.length>0){pendHTML=eyebrow('Aguardando feedback')+pend.map(function(w){var idx=workouts.indexOf(w);return '<div style="background:var(--gold-dim2);border:1px solid rgba(200,149,42,0.15);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted);margin-bottom:4px">'+w.day_label+' — '+w.type+'</div><div style="font-size:13px;color:var(--text-dim);font-weight:300">'+w.description+'</div></div><button onclick="openModal('+idx+')" style="background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;border-radius:6px;padding:9px 14px;color:var(--black);font-family:DM Mono,monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;flex-shrink:0;margin-left:12px">Dar</button></div>';}).join('');}
  var doneHTML='';
  if(done.length>0){doneHTML=eyebrow('Enviados')+done.map(function(w){var f=w.feedback;var extras=[];if(f.fadiga)extras.push('pernas '+f.fadiga);if(f.sono)extras.push('sono '+f.sono);if(f.hidratacao)extras.push('hidra '+f.hidratacao);if(f.gel&&f.gel!=='não usei')extras.push(f.gel);if(f.frequencia_cardiaca&&f.frequencia_cardiaca!=='normal')extras.push('fc '+f.frequencia_cardiaca);return '<div class="fb-card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><div><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted)">'+w.day_label+' — '+w.type+'</div><div style="font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:300">'+w.description+'</div></div><div style="text-align:right"><div style="font-family:Cormorant Garamond,serif;font-weight:400;font-style:italic;font-size:26px;color:var(--gold);line-height:1">'+f.rpe+'</div><div style="font-family:DM Mono,monospace;font-size:7px;color:var(--text-muted)">RPE</div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:'+(extras.length||f.comment?'8px':'0')+'">'+tag('energia '+(f.energia||''),'var(--green)')+' '+extras.map(function(e){return tag(e,'var(--text-muted)');}).join('')+'</div>'+(f.comment?'<div style="font-size:12px;color:var(--text-muted);font-style:italic;font-weight:300;border-top:1px solid var(--border);padding-top:8px;margin-top:4px">"'+f.comment+'"</div>':'')+'</div>';}).join('');}
  var empty=pend.length===0&&done.length===0?'<div style="text-align:center;padding:50px 20px;color:var(--text-muted);font-family:DM Mono,monospace;font-size:10px">Nenhum treino concluído ainda</div>':'';
  document.getElementById('athlete-content').innerHTML=titleLg('Feedback')+pendHTML+doneHTML+empty;
}

function renderAthRelatorio(){
  var id=currentUser?currentUser.id:'';var rel=RELATORIOS[id];
  if(!rel){document.getElementById('athlete-content').innerHTML=titleLg('Relatório')+'<div style="text-align:center;padding:50px 20px;color:var(--text-muted);font-family:DM Mono,monospace;font-size:10px;line-height:2">Relatório do mês<br>em breve.</div>';return;}
  var badgesHTML=rel.badges.map(function(b){return '<span class="rel-badge '+b.cls+'">'+b.txt+'</span>';}).join('');
  var statsHTML='<div class="rel-stat-grid">'+rel.stats.map(function(s){return '<div class="rel-stat"><div class="rel-stat-val">'+s.val+'</div><div class="rel-stat-lbl">'+s.lbl+'</div><div class="rel-stat-sub">'+s.sub+'</div></div>';}).join('')+'</div>';
  var progHTML=rel.progresso.map(function(p){return '<div class="rel-prog-item"><div class="rel-prog-header"><span class="rel-prog-label">'+p.lbl+'</span><span class="rel-prog-val">'+p.val+'</span></div><div class="rel-prog-bar"><div class="rel-prog-fill" style="width:0%;background:'+p.cor+'" data-w="'+p.w+'"></div></div></div>';}).join('');
  var infosHTML='<div class="rel-info-grid">'+rel.infos.map(function(i){return '<div class="rel-info '+i.cls+'"><div class="rel-info-title">'+i.titulo+'</div><p>'+i.txt+'</p></div>';}).join('')+'</div>';
  document.getElementById('athlete-content').innerHTML=
    '<div style="margin-bottom:18px"><div style="font-family:DM Mono,monospace;font-size:8px;color:var(--text-muted);letter-spacing:.2em;margin-bottom:4px;text-transform:uppercase">'+rel.mes+' · '+rel.objetivo+'</div>'+titleLg('Relatório')+'<div>'+badgesHTML+'</div></div>'+
    statsHTML+eyebrow('Resumo')+'<div class="rel-summary">'+rel.resumo+'</div>'+
    eyebrow('Análise')+'<div style="margin-bottom:18px">'+progHTML+'</div>'+
    eyebrow('Destaques')+infosHTML+
    eyebrow('Nota do Coach')+'<div class="rel-coach-note"><p>'+rel.nota+'</p><div class="rel-coach-sig">— Run Base · Maio 2026</div></div>';
  setTimeout(function(){document.querySelectorAll('.rel-prog-fill').forEach(function(b){b.style.width=b.dataset.w+'%';});},100);
}

function openModal(idx){
  fbTargetIdx=idx;var w=workouts[idx];
  document.getElementById('fb-title').textContent=w.day_label+' — '+w.type;
  document.getElementById('fb-desc').textContent=w.description;
  selectedRpe=null;selectedEn=null;selectedFadiga=null;selectedSono=null;selectedHidra=null;selectedGel=null;selectedFc=null;
  document.getElementById('fb-comment').value='';
  var rg=document.getElementById('rpe-grid');rg.innerHTML='';
  for(var n=1;n<=10;n++){(function(n){var b=document.createElement('button');b.className='rpe-btn';b.textContent=n;b.onclick=function(){selectedRpe=n;updateRpe();};rg.appendChild(b);})(n);}
  var eg=document.getElementById('en-grid');eg.innerHTML='';
  ENS.forEach(function(e,i){var b=document.createElement('button');b.className='en-btn';b.textContent=e;b.onclick=function(){selectedEn=e;highlightGrid('en-grid',i,EC);updateSubmit();};eg.appendChild(b);});
  makePillGrid('fadiga-grid',['leves','normais','pesadas','muito pesadas'],['#5a9e6f','#C8952A','#c06030','#c0503a'],function(v){selectedFadiga=v;});
  makePillGrid('sono-grid',['ruim','ok','bom','ótimo'],['#c0503a','#C8952A','#5a9e6f','#5a8fb0'],function(v){selectedSono=v;});
  makePillGrid('hidra-grid',['pouca','suficiente','bastante'],['#c06030','#5a9e6f','#5a8fb0'],function(v){selectedHidra=v;});
  makePillGrid('gel-grid',['não usei','1 gel','2 géis','3+ géis'],'#C8952A',function(v){selectedGel=v;});
  makePillGrid('fc-grid',['normal','elevada','muito alta'],['#5a9e6f','#c06030','#c0503a'],function(v){selectedFc=v;});
  updateSubmit();
  document.getElementById('fb-modal').classList.add('open');
}
function updateRpe(){
  document.querySelectorAll('.rpe-btn').forEach(function(b,i){var n=i+1;if(n===selectedRpe){b.style.background=RC[n-1]+'33';b.style.borderColor=RC[n-1];b.style.color=RC[n-1];}else{b.style.background='transparent';b.style.borderColor='var(--border2)';b.style.color='var(--text-muted)';}});
  document.getElementById('rpe-label').textContent=RPELBL[selectedRpe]||'';
  updateSubmit();
}
function updateSubmit(){var ok=selectedRpe!==null&&selectedEn!==null;var btn=document.getElementById('submit-fb');btn.classList.toggle('ready',ok);btn.textContent=ok?'Enviar Feedback':'preencha esforço e energia';}
function closeModal(){document.getElementById('fb-modal').classList.remove('open');}
async function submitFeedback(){
  if(!selectedRpe||!selectedEn)return;
  var w=workouts[fbTargetIdx];var btn=document.getElementById('submit-fb');
  btn.textContent='Salvando...';btn.disabled=true;
  var res=await sb.from('feedbacks').insert({workout_id:w.id,athlete_id:currentUser.id,rpe:selectedRpe,energia:selectedEn,fadiga:selectedFadiga,sono:selectedSono,hidratacao:selectedHidra,gel:selectedGel,frequencia_cardiaca:selectedFc,comment:document.getElementById('fb-comment').value}).select().single();
  btn.textContent='Enviar Feedback';btn.disabled=false;
  if(res.error){showToast('Erro ao salvar',false);return;}
  workouts[fbTargetIdx].done=true;workouts[fbTargetIdx].feedback=res.data;
  closeModal();showToast('Feedback enviado ✓');renderAthlete();
}
</script>
